<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculator</title>

  <link rel="icon" href="/assets/calculator.svg" type="assets/svg+xml">
  <link rel="stylesheet" href="styles.css">
  <script src="script.js"></script>
</head>
<body>
  <main class="calculator">
    <section class="display">
      <input type="text" class="screen" readonly>
    </section>

    <section class="buttons-grid">
      <button class="button function-btn">C</button>
      <button class="button function-btn">AC</button>
      <button class="button operator-btn">%</button>
      <button class="button operator-btn">÷</button>

      <button class="button number-btn">7</button>
      <button class="button number-btn">8</button>
      <button class="button number-btn">9</button>
      <button class="button operator-btn">x</button>

      <button class="button number-btn">4</button>
      <button class="button number-btn">5</button>
      <button class="button number-btn">6</button>
      <button class="button operator-btn">-</button>

      <button class="button number-btn">1</button>
      <button class="button number-btn">2</button>
      <button class="button number-btn">3</button>
      <button class="button operator-btn">+</button>

      <button class="button number-btn">0</button>
      <button class="button number-btn">.</button>
      <button class="button operator-btn">=</button>
    </section>
  </main>
</body>
</html>
