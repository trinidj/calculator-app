<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculator</title>

  <link rel="icon" href="/assets/calculator.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="calculator">
    <section role="display">
      <input id="display" type="text" class="screen" readonly>
    </section>

    <section class="buttons-grid">
      <button id="memory-store" class="button function-btn">MS</button>
      <button id="clear-btn" class="button function-btn">C</button>
      <button id="radical-btn" class="button function-btn">√</button>
      <button id="percent-btn" class="button operator-btn">%</button>
      <button id="divide-btn" class="button operator-btn">÷</button>

      <button id="memory-clear" class="button function-btn">MC</button>
      <button class="button number-btn" value="7">7</button>
      <button class="button number-btn" value="8">8</button>
      <button class="button number-btn" value="9">9</button>
      <button id="multiply-btn" class="button operator-btn">x</button>

      <button id="memory-recall" class="button function-btn">MR</button>
      <button class="button number-btn" value="4">4</button>
      <button class="button number-btn" value="5">5</button>
      <button class="button number-btn" value="6">6</button>
      <button id="subtract-btn" class="button operator-btn">-</button>

      <button id="memory-add" class="button function-btn">M+</button>
      <button class="button number-btn" value="1">1</button>
      <button class="button number-btn" value="2">2</button>
      <button class="button number-btn" value="3">3</button>
      <button id="add-btn" class="button operator-btn">+</button>

      <button id="memory-subtract" class="button function-btn">M-</button>
      <button class="button number-btn" value="0">0</button>
      <button id="decimal-btn" class="button number-btn">.</button>
      <button id="negate-btn" class="button function-btn">+/-</button>
      <button id="equals-btn" class="button operator-btn">=</button>
    </section>
  </main>

  <script src="script.js" type="module"></script>
</body>
</html>
